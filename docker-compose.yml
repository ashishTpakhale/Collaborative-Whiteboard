x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment: &env
    REDIS_URL: redis://redis:6379
    PORT: 3000
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 10
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
  server-1:
    <<: *backend
    environment:
      <<: *env
      SERVER_ID: server-1
  server-2:
    <<: *backend
    environment:
      <<: *env
      SERVER_ID: server-2
  server-3:
    <<: *backend
    environment:
      <<: *env
      SERVER_ID: server-3
  frontend:
    build: ./frontend
  nginx:
    image: nginx:1.28-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      server-3:
        condition: service_healthy
      frontend:
        condition: service_started
volumes:
  redis-data:

