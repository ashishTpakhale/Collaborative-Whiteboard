events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream backends {
    zone backends 64k;
    # Round-robin applies to new connections; an established socket stays put.
    server server-1:3000 resolve max_fails=1 fail_timeout=5s;
    server server-2:3000 resolve max_fails=1 fail_timeout=5s;
    server server-3:3000 resolve max_fails=1 fail_timeout=5s;
  }
  upstream frontend { zone frontend 64k; server frontend:80 resolve; }
  server {
    listen 80;
    location /ws {
      proxy_pass http://backends;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_buffering off;
    }
    location /health { proxy_pass http://backends; }
    location / { proxy_pass http://frontend; }
  }
}

